name: CI

on:
  pull_request:
  push:
    branches:
    - master

jobs:
  tests:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        runs-on: [macos-latest]
        python-version: [3.7.17, 3.8.20, 3.9.22, 3.10.17, 3.11.12, 3.12.10]
        include:
          - runs-on: macos-latest
            c-compiler: "clang"
            cxx-compiler: "clang++"
            # OPENSSL_ROOT_DIR: the default OpenSSL of the runner image is OpenSSL 4,
            # which the tested Python versions cannot be built against, so use the
            # OpenSSL 3 that the image also provides.
            initial-dashboard-cache: |
              CMAKE_OSX_DEPLOYMENT_TARGET:STRING=10.13
              OPENSSL_ROOT_DIR:PATH=/opt/homebrew/opt/openssl@3

    name: python-${{ matrix.python-version }}-${{ matrix.runs-on }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        path: src

    - name: Setup cmake
      uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2.2.0
      with:
        cmake-version: 3.20.6

    - name: Setup ninja
      uses: ashutoshvarma/setup-ninja@66ad2db9ed7d211c065daeeb849e9c8c895773c9 # master
      with:
        version: 1.10.0

    - name: Download dashboard script
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: 'python-cmake-buildsystem/python-cmake-buildsystem'
        ref: dashboard
        fetch-depth: 0
        path: scripts

    - name: Writing initial dashboard cache
      shell: bash
      run: |
        cat > scripts/initial-dashboard-cache.txt << EOF
        ${{ matrix.initial-dashboard-cache }}
        EOF
        cat scripts/initial-dashboard-cache.txt

    - name: Build & Test
      run: ctest --timeout 360 -S scripts/github_actions_dashboard.cmake -VV
      env:
        PY_VERSION: ${{ matrix.python-version }}
        CC: ${{ matrix.c-compiler }}
        CXX: ${{ matrix.cxx-compiler }}

  # Same builds as the "build-test-python" jobs of .circleci/config.yml
  tests-linux:
    runs-on: ubuntu-24.04
    container:
      image: dockcross/linux-${{ matrix.python-arch }}
    strategy:
      fail-fast: false
      matrix:
        python-arch: [x64, x86]
        python-version: [3.6.15, 3.7.17, 3.8.20, 3.9.22, 3.10.17, 3.11.12, 3.12.10]

    name: python-${{ matrix.python-version }}-linux-${{ matrix.python-arch }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        path: src

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libbz2-dev \
          libdb-dev \
          libffi-dev \
          libgdbm-compat-dev \
          libgdbm-dev \
          liblzma-dev \
          libncursesw5-dev \
          libreadline-dev \
          libsqlite3-dev \
          libssl-dev \
          tcl-dev \
          tk-dev

    - name: Download dashboard script
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: 'python-cmake-buildsystem/python-cmake-buildsystem'
        ref: dashboard
        fetch-depth: 0
        path: scripts

    - name: Build & Test
      run: ctest --timeout 360 -S src/.github/dashboard/github_actions_linux_dashboard.cmake -VV
      env:
        PY_VERSION: ${{ matrix.python-version }}

  # Same builds as the "build-test-python-win" jobs of .circleci/config.yml,
  # with a newer version of Visual Studio.
  tests-windows:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        runs-on: [windows-2022]
        python-arch: [x64]
        python-version: [3.6.15, 3.7.17, 3.8.20, 3.9.22, 3.10.17, 3.11.12, 3.12.10]
        generator: ["Visual Studio 17 2022"]
        include:
          # Windows on ARM: CPython supports it since Python 3.11.
          # The runner provides Visual Studio 2026.
          - runs-on: windows-11-arm
            python-arch: ARM64
            python-version: 3.11.12
            generator: "Visual Studio 18 2026"
          - runs-on: windows-11-arm
            python-arch: ARM64
            python-version: 3.12.10
            generator: "Visual Studio 18 2026"
          # ARM64EC (x64 compatible code running natively on ARM64) is supported
          # for Python 3.12 (see patches/3.12). ARM64EC binaries can only run on
          # Windows ARM64.
          - runs-on: windows-11-arm
            python-arch: ARM64EC
            python-version: 3.12.10
            generator: "Visual Studio 18 2026"

    name: python-${{ matrix.python-version }}-windows-${{ matrix.python-arch }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        path: src

    - name: Install the MSVC ARM64EC build tools if missing
      if: matrix.python-arch == 'ARM64EC'
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $component = "Microsoft.VisualStudio.Component.VC.Tools.ARM64EC"
        $installPath = & $vswhere -latest -products * -property installationPath
        if (& $vswhere -latest -products * -requires $component -property installationPath) {
          Write-Host "$component is installed in $installPath"
          exit 0
        }
        Write-Host "Installing $component in $installPath"
        $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
        $process = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList `
          "modify", "--installPath", "`"$installPath`"", "--add", $component, "--quiet", "--norestart", "--nocache"
        if (-not (& $vswhere -latest -products * -requires $component -property installationPath)) {
          throw "Failed to install $component (installer exit code $($process.ExitCode))"
        }

    # The OpenSSL of the runner is ARM64, which cannot be linked into ARM64EC
    # binaries. OpenSSL has no ARM64EC target, but its portable C code (no-asm)
    # can be built as ARM64EC. Build it as static libraries, so that the
    # extension modules do not depend on OpenSSL DLLs.
    - name: Restore the ARM64EC build of OpenSSL
      if: matrix.python-arch == 'ARM64EC'
      id: cache-openssl
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: openssl-install
        key: openssl-3.5.9-windows-ARM64EC-static

    - name: Build OpenSSL for ARM64EC
      if: matrix.python-arch == 'ARM64EC' && steps.cache-openssl.outputs.cache-hit != 'true'
      shell: pwsh
      env:
        OPENSSL_VERSION: 3.5.9
        OPENSSL_SHA256: 603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a
        CL: /arm64EC
      run: |
        $archive = "openssl-$env:OPENSSL_VERSION.tar.gz"
        Invoke-WebRequest -OutFile $archive `
          "https://github.com/openssl/openssl/releases/download/openssl-$env:OPENSSL_VERSION/$archive"
        if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $env:OPENSSL_SHA256) {
          throw "Unexpected SHA256 of $archive"
        }
        tar -xzf $archive
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vcvarsall = "$(& $vswhere -latest -products * -property installationPath)\VC\Auxiliary\Build\vcvarsall.bat"
        $prefix = "$env:GITHUB_WORKSPACE\openssl-install"
        Set-Location "openssl-$env:OPENSSL_VERSION"
        perl -v | Select-String "This is perl"
        cmd /c "`"$vcvarsall`" arm64 && perl Configure VC-WIN64A no-asm no-uplink no-shared no-tests `"ARFLAGS=/nologo /MACHINE:ARM64EC`" --prefix=`"$prefix`" --openssldir=`"$prefix\ssl`" && nmake build_libs && nmake install_dev"
        if ($LASTEXITCODE) {
          throw "Failed to build OpenSSL (exit code $LASTEXITCODE)"
        }

    # The x64 OpenSSL of the runner is built with "uplink", which requires the
    # executable to export OPENSSL_Applink. Use the OpenSSL of CPython instead
    # (see PCbuild/get_externals.bat), which is built with "no-uplink".
    - name: Download the OpenSSL of CPython
      if: matrix.python-arch == 'x64'
      shell: pwsh
      env:
        OPENSSL_BIN_VERSION: 3.0.16.2
        OPENSSL_BIN_SHA256: 8686b76cbd4192143ed73bc60719efdb080bcdb8f887bdb7d66c5fecd2b6a36f
      run: |
        $archive = "openssl-bin-$env:OPENSSL_BIN_VERSION.zip"
        Invoke-WebRequest -OutFile $archive `
          "https://github.com/python/cpython-bin-deps/archive/refs/tags/openssl-bin-$env:OPENSSL_BIN_VERSION.zip"
        if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $env:OPENSSL_BIN_SHA256) {
          throw "Unexpected SHA256 of $archive"
        }
        Expand-Archive $archive -DestinationPath .
        Rename-Item "cpython-bin-deps-openssl-bin-$env:OPENSSL_BIN_VERSION" openssl-bin

    - name: Download dashboard script
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: 'python-cmake-buildsystem/python-cmake-buildsystem'
        ref: dashboard
        fetch-depth: 0
        path: scripts

    - name: Build & Test
      run: ctest -C Release -S src/.github/dashboard/github_actions_windows_dashboard.cmake -VV
      env:
        PY_VERSION: ${{ matrix.python-version }}
        CONFIGURATION: Release
        GENERATOR: ${{ matrix.generator }}
        PLATFORM: ${{ matrix.python-arch }}
        OPENSSL_ROOT_DIR: ${{ matrix.python-arch == 'ARM64EC' && format('{0}\openssl-install', github.workspace) || matrix.python-arch == 'x64' && format('{0}\openssl-bin\amd64', github.workspace) || '' }}

    # The dashboard script reports build and test results to CDash without
    # failing the job, so check the ARM64EC specific results here: the binaries
    # are ARM64EC, and the modules affected by the ARM64EC fixes and the
    # ARM64EC build of OpenSSL work (HACL* hash functions, atomics, x64
    # assembly of _decimal, _hashlib, _ssl).
    - name: Check ARM64EC build
      if: matrix.python-arch == 'ARM64EC'
      run: |
        # test_ssl is skipped, and thus passes, if the ssl module is missing
        build\bin\Release\python.exe -c "import ssl, _hashlib; print(ssl.OPENSSL_VERSION)"
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        ctest -C Release --test-dir build --output-on-failure --no-tests=error --timeout 360 -R "^(check_arm64ec|test_hashlib|test_decimal|test_threading|test_sys|test_ssl)$"

  pass: # This job does nothing and is only used for the branch protection
    if: always()
    needs:
    - tests
    - tests-linux
    - tests-windows

    runs-on: ubuntu-latest

    steps:
    - name: Decide whether the needed jobs succeeded or failed
      uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.2.2
      with:
        jobs: ${{ toJSON(needs) }}
