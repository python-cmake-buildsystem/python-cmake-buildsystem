name: Android

on:
  pull_request:
  push:
    branches:
    - master
  workflow_dispatch:

jobs:
  android:
    # Hardware-accelerated Android emulator is only available for x86 and x86_64
    # images on x86_64 Linux runners with KVM. ARM ABIs are tested on an x86_64
    # image that can run ARM executables using binary translation.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python versions
          - { python-version: 3.8.20, python-for-build-version: "3.8", android-abi: x86_64, emulator-arch: x86_64, emulator-api-level: 34, emulator-target: default }
          - { python-version: 3.9.22, python-for-build-version: "3.9", android-abi: x86_64, emulator-arch: x86_64, emulator-api-level: 34, emulator-target: default }
          - { python-version: 3.10.17, python-for-build-version: "3.10", android-abi: x86_64, emulator-arch: x86_64, emulator-api-level: 34, emulator-target: default }
          - { python-version: 3.11.12, python-for-build-version: "3.11", android-abi: x86_64, emulator-arch: x86_64, emulator-api-level: 34, emulator-target: default }
          - { python-version: 3.12.10, python-for-build-version: "3.12", android-abi: x86_64, emulator-arch: x86_64, emulator-api-level: 34, emulator-target: default }
          # ABIs
          - { python-version: 3.12.10, python-for-build-version: "3.12", android-abi: x86, emulator-arch: x86, emulator-api-level: 30, emulator-target: google_apis }
          # ARM executables run using binary translation, which does not support fork(): only the smoke test is run
          - { python-version: 3.12.10, python-for-build-version: "3.12", android-abi: arm64-v8a, emulator-arch: x86_64, emulator-api-level: 31, emulator-target: google_apis, skip-unit-tests: true }
          - { python-version: 3.12.10, python-for-build-version: "3.12", android-abi: armeabi-v7a, emulator-arch: x86_64, emulator-api-level: 30, emulator-target: google_apis, skip-unit-tests: true }
          # Extensions built into the interpreter
          - { python-version: 3.12.10, python-for-build-version: "3.12", android-abi: x86_64, emulator-arch: x86_64, emulator-api-level: 34, emulator-target: default, extra-cmake-args: "-DBUILD_EXTENSIONS_AS_BUILTIN:BOOL=ON", name-suffix: "-builtin" }

    name: python-${{ matrix.python-version }}-android-${{ matrix.android-abi }}${{ matrix.name-suffix }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup ninja
      uses: ashutoshvarma/setup-ninja@66ad2db9ed7d211c065daeeb849e9c8c895773c9 # master
      with:
        version: 1.10.0

    # Python of the same major.minor version for the build host, used to generate
    # the frozen modules and the sysconfig data
    - name: Setup Python for build
      id: python-for-build
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-for-build-version }}

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    # The emulator must be running during configuration, as configuration checks
    # are executed on the target using "run_on_android.sh".
    - name: Build & Test
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
      env:
        ANDROID_ABI: ${{ matrix.android-abi }}
        ANDROID_PLATFORM: 21
        PY_VERSION: ${{ matrix.python-version }}
        PYTHON_FOR_BUILD: ${{ steps.python-for-build.outputs.python-path }}
        EXTRA_CMAKE_ARGS: ${{ matrix.extra-cmake-args }}
        RUN_UNIT_TESTS: ${{ matrix.skip-unit-tests && '0' || '1' }}
      with:
        api-level: ${{ matrix.emulator-api-level }}
        arch: ${{ matrix.emulator-arch }}
        target: ${{ matrix.emulator-target }}
        disable-animations: true
        emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
        script: ANDROID_NDK=$ANDROID_NDK_LATEST_HOME bash .github/scripts/android_build_and_test.sh

  android-no-device:
    # Configure using the results of the configuration checks provided by
    # cmake/AndroidTryRunResults.cmake instead of running them on a device
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        android-abi: [x86_64, x86, arm64-v8a, armeabi-v7a]
        python-version: [3.12.10]
    name: python-${{ matrix.python-version }}-android-${{ matrix.android-abi }}-no-device
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup ninja
      uses: ashutoshvarma/setup-ninja@66ad2db9ed7d211c065daeeb849e9c8c895773c9 # master
      with:
        version: 1.10.0

    - name: Setup Python for build
      id: python-for-build
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"

    - name: Build
      env:
        ANDROID_ABI: ${{ matrix.android-abi }}
        ANDROID_PLATFORM: 21
        PY_VERSION: ${{ matrix.python-version }}
        PYTHON_FOR_BUILD: ${{ steps.python-for-build.outputs.python-path }}
        CACHE_PRESET: cmake/AndroidTryRunResults.cmake
      run: ANDROID_NDK=$ANDROID_NDK_LATEST_HOME bash .github/scripts/android_build_and_test.sh
